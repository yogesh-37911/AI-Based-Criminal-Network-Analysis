# Free-tier Render Blueprint for the FORGE-AI monorepo.
# Free web services have ephemeral filesystems. Uploaded evidence is not durable.
# Secret values are entered in Render's dashboard; never commit API keys here.
services:
  - type: web
    name: forge-ai-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: forge-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: SEED_DEMO_DATA
        value: "true"
      - key: NVIDIA_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false

  - type: web
    name: forge-ai-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: forge-ai-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: forge-ai-db
    databaseName: forge_ai
    user: forge
    postgresMajorVersion: "16"
    plan: free
    region: singapore
    ipAllowList: []
